<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIG4 - Ultimate AI & Security Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #050505; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .dashboard { width: 100%; max-width: 950px; background: rgba(15, 15, 15, 0.95); border: 1px solid #222; border-radius: 16px; padding: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.9); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding-bottom: 20px; margin-bottom: 25px; }
        .header h1 { font-size: 24px; color: #fff; letter-spacing: 1px; }
        .header span { color: #ff2a2a; font-size: 13px; background: rgba(255,42,42,0.1); padding: 5px 12px; border-radius: 20px; border: 1px solid rgba(255,42,42,0.3); }

        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-box { background: #111; border: 1px solid #222; padding: 20px; border-radius: 12px; text-align: center; }
        .stat-box h2 { font-size: 28px; color: #fff; margin-bottom: 5px; }
        .stat-box p { color: #777; font-size: 13px; }

        .panel-section { background: #111; border: 1px solid #222; padding: 20px; border-radius: 12px; margin-bottom: 25px; }
        .panel-section h3 { font-size: 16px; margin-bottom: 15px; color: #ff2a2a; }
        
        .form-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        input, select, textarea { flex: 1; min-width: 200px; background: #0a0a0a; border: 1px solid #333; padding: 12px; border-radius: 8px; color: #fff; outline: none; }
        textarea { width: 100%; height: 100px; resize: vertical; font-family: monospace; font-size: 13px; }
        input:focus, select:focus, textarea:focus { border-color: #ff2a2a; }
        button { background: #ff2a2a; color: #fff; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #d61e1e; }

        .keys-table { width: 100%; border-collapse: collapse; background: #0a0a0a; border-radius: 8px; overflow: hidden; border: 1px solid #222; }
        .keys-table th, .keys-table td { padding: 12px 15px; text-align: right; border-bottom: 1px solid #1a1a1a; font-size: 14px; }
        .keys-table th { background: #141414; color: #888; font-weight: 600; }
        .badge { background: rgba(255,42,42,0.15); color: #ff2a2a; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        
        .output-box { background: #080808; border: 1px dashed #333; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 12px; color: #ff5555; word-break: break-all; margin-top: 10px; max-height: 150px; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <h1>DIG4 - AI & SECURITY CONTROL</h1>
            <span>SYSTEM ACTIVE</span>
        </div>

        <!-- الإحصائيات -->
        <div class="stats-container">
            <div class="stat-box">
                <h2 id="activeKeysCount">0</h2>
                <p>المفاتيح النشطة</p>
            </div>
            <div class="stat-box">
                <h2 id="bannedCount">0</h2>
                <p>المستخدمين المحظورين</p>
            </div>
            <div class="stat-box">
                <h2 id="totalReqCount">0</h2>
                <p>إجمالي الطلبات</p>
            </div>
        </div>

        <!-- نظام تشفير السكربتات Obfuscator -->
        <div class="panel-section">
            <h3>🔒 نظام تشفير السكربتات (Lua Obfuscator)</h3>
            <textarea id="rawScript" placeholder="ضع كود Lua العادي هنا لتشفيره وحمايته عبر DIG4..."></textarea>
            <button onclick="obfuscateScript()">تشفير الكود الآن</button>
            <div id="obfuscatedOutput" class="output-box" style="display:none;"></div>
        </div>

        <!-- نظام الذكاء الاصطناعي AI Helper -->
        <div class="panel-section">
            <h3>🤖 مساعد الذكاء الاصطناعي (AI Assistant)</h3>
            <div class="form-group">
                <input type="text" id="aiPrompt" placeholder="اطلب من الذكاء الاصطناعي كتابة كود أو إنشاء مفتاح باسم خاص...">
                <button onclick="askAI()">توليد عبر الذكاء الاصطناعي</button>
            </div>
            <div id="aiOutput" class="output-box" style="display:none;"></div>
        </div>

        <!-- قسم توليد مفتاح جديد -->
        <div class="panel-section">
            <h3>🔑 إدارة وتوليد المفاتيح</h3>
            <div class="form-group">
                <input type="text" id="customKey" placeholder="اكتب المفتاح أو اتركه فارغاً للتوليد">
                <select id="keyDuration">
                    <option value="Lifetime">دائم (Lifetime)</option>
                    <option value="24 Hours">24 ساعة</option>
                    <option value="7 Days">7 أيام</option>
                </select>
                <button onclick="generateKey()">توليد وإضافة</button>
            </div>
        </div>

        <!-- قائمة المفاتيح الفعالة -->
        <div class="panel-section">
            <h3>المفاتيح النشطة في السيرفر</h3>
            <table class="keys-table">
                <thead>
                    <tr>
                        <th>المفتاح</th>
                        <th>المدة</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody id="keysTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchDashboardData() {
            try {
                const res = await fetch('/api/keys-list');
                const data = await res.json();
                
                document.getElementById('activeKeysCount').innerText = data.activeKeys;
                document.getElementById('bannedCount').innerText = data.bannedCount;
                document.getElementById('totalReqCount').innerText = data.totalRequests;

                const tbody = document.getElementById('keysTableBody');
                tbody.innerHTML = '';
                data.keys.forEach(k => {
                    tbody.innerHTML += `
                        <tr>
                            <td><code>${k.key}</code></td>
                            <td>${k.duration}</td>
                            <td><span class="badge">نشط</span></td>
                        </tr>
                    `;
                });
            } catch (e) { console.error(e); }
        }

        async function obfuscateScript() {
            const script = document.getElementById('rawScript').value;
            if(!script) return alert("الرجاء كتابة كود لتشفيره");

            const res = await fetch('/api/obfuscate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ script })
            });
            const data = await res.json();
            const out = document.getElementById('obfuscatedOutput');
            out.style.display = 'block';
            out.innerText = data.obfuscatedScript;
        }

        async function askAI() {
            const prompt = document.getElementById('aiPrompt').value;
            if(!prompt) return alert("اكتب طلبك للذكاء الاصطناعي");

            const res = await fetch('/api/ai-generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt })
            });
            const data = await res.json();
            const out = document.getElementById('aiOutput');
            out.style.display = 'block';
            out.innerText = data.response;
        }

        async function generateKey() {
            let keyInput = document.getElementById('customKey').value.trim();
            if(!keyInput) {
                keyInput = "DIG4-" + Math.random().toString(36).substring(2, 8).toUpperCase();
            }
            const duration = document.getElementById('keyDuration').value;

            await fetch('/api/add-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: keyInput, duration: duration })
            });

            document.getElementById('customKey').value = '';
            fetchDashboardData();
        }

        fetchDashboardData();
        setInterval(fetchDashboardData, 4000);
    </script>
</body>
</html>
