<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRX LUA - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #0a0a0c; color: #fff; min-height: 100vh; padding: 25px; display: flex; justify-content: center; }
        .dashboard { width: 100%; max-width: 900px; }
        
        /* الهيدر والعنوان */
        .header { margin-bottom: 25px; text-align: right; border-bottom: 1px solid #1f1f26; padding-bottom: 15px; }
        .header h1 { font-size: 26px; color: #fff; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .header .badge { background: #ff2a2a; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .header p { color: #888; font-size: 14px; margin-top: 5px; }

        /* الكروت والإحصائيات */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: #121217; border: 1px solid #1f1f26; border-radius: 12px; padding: 20px; text-align: center; position: relative; overflow: hidden; }
        .stat-card.red-glow { border-color: rgba(255, 42, 42, 0.4); box-shadow: 0 0 15px rgba(255, 42, 42, 0.1); }
        .stat-card h2 { font-size: 32px; color: #fff; margin-bottom: 5px; }
        .stat-card p { color: #888; font-size: 13px; }

        /* اللوحة الحمراء وأزرار التحكم */
        .action-box { background: #121217; border: 1px solid #1f1f26; border-radius: 12px; padding: 20px; margin-bottom: 25px; }
        .action-box h3 { color: #fff; font-size: 16px; margin-bottom: 15px; }
        .inputs-row { display: flex; gap: 10px; flex-wrap: wrap; }
        input, select { flex: 1; min-width: 180px; background: #0a0a0c; border: 1px solid #2a2a35; padding: 12px; border-radius: 8px; color: #fff; outline: none; }
        input:focus { border-color: #ff2a2a; }
        
        .btn-red { background: #ff2a2a; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-red:hover { background: #d61e1e; }

        /* جدول المفاتيح النشطة */
        .table-container { background: #121217; border: 1px solid #1f1f26; border-radius: 12px; padding: 20px; }
        .table-container h3 { margin-bottom: 15px; font-size: 16px; color: #fff; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #1f1f26; font-size: 14px; }
        th { color: #666; font-weight: 600; }
        td code { color: #ff5555; background: rgba(255,85,85,0.1); padding: 3px 8px; border-radius: 4px; font-family: monospace; }
        .status-active { color: #00ffcc; font-size: 12px; }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <h1>نظام حماية وإدارة السكربتات المتقدم <span class="badge">FRX PROTECTION LIVE</span></h1>
            <p>يمكنك من هنا التحكم التام بسكربتات روبلوكس، حمايتها، وإصدار مفاتيح لعملائك.</p>
        </div>

        <!-- إحصائيات النظام باللون الاحمر -->
        <div class="stats-grid">
            <div class="stat-card red-glow">
                <h2 id="activeKeysCount">0</h2>
                <p>المفاتيح النشطة</p>
            </div>
            <div class="stat-card">
                <h2 id="bannedCount">0</h2>
                <p>المستخدمين المحظورين</p>
            </div>
            <div class="stat-card">
                <h2 id="totalReqCount">0</h2>
                <p>مرات التشغيل اليوم</p>
            </div>
        </div>

        <!-- زر التوليد والإضافة -->
        <div class="action-box">
            <h3>توليد أصدار مفاتيح جديدة</h3>
            <div class="inputs-row">
                <input type="text" id="customKey" placeholder="اكتب المفتاح أو اتركه فارغاً للتوليد">
                <select id="keyDuration">
                    <option value="Lifetime">دائم (Lifetime)</option>
                    <option value="7 أيام">7 أيام</option>
                    <option value="24 ساعة">24 ساعة</option>
                </select>
                <button class="btn-red" onclick="generateKey()">+ توليد مفتاح جديد</button>
            </div>
        </div>

        <!-- قائمة المفاتيح الحقيقية -->
        <div class="table-container">
            <h3>قائمة المفاتيح المفعّلة بالسيرفر</h3>
            <table>
                <thead>
                    <tr>
                        <th>المفتاح</th>
                        <th>المدة</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody id="keysTableBody">
                    <!-- تتعبأ تلقائياً من السيرفر -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // جلب المفاتيح والإحصائيات وتحديثها فوراً
        async function loadData() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                
                document.getElementById('activeKeysCount').innerText = data.activeKeysCount;
                document.getElementById('bannedCount').innerText = data.bannedCount;
                document.getElementById('totalReqCount').innerText = data.totalRequests;

                const tbody = document.getElementById('keysTableBody');
                tbody.innerHTML = '';
                data.keys.forEach(k => {
                    tbody.innerHTML += `
                        <tr>
                            <td><code>${k.key}</code></td>
                            <td>${k.duration}</td>
                            <td><span class="status-active">● نشط</span></td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("خطأ الاتصال بالسيرفر:", err);
            }
        }

        // دالة الزر: توليد وإضافة مفتاح جديد
        async function generateKey() {
            let keyInput = document.getElementById('customKey').value.trim();
            if(!keyInput) {
                keyInput = "FRX-" + Math.random().toString(36).substring(2, 8).toUpperCase() + "-KEY";
            }
            const duration = document.getElementById('keyDuration').value;

            const res = await fetch('/api/add-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: keyInput, duration: duration })
            });

            if(res.ok) {
                document.getElementById('customKey').value = '';
                loadData(); // تحديث القائمة والأرقام فوراً
            }
        }

        loadData();
        setInterval(loadData, 3000); // تحديث الإحصائيات والمفاتيح كل 3 ثواني
    </script>
</body>
</html>
